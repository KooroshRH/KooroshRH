# Rebuilds the two activity cards in README.md and publishes them to the
# `output` branch, so `main` stays free of daily bot commits.
#
# Works with the default GITHUB_TOKEN (public activity only). To include
# private contributions, add a classic personal access token with the
# `read:user` and `repo` scopes as a repository secret named STATS_TOKEN.

name: Profile cards

on:
  schedule:
    - cron: "41 7 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Borderless, untitled cards on a transparent background, so they sit in the page.
  COMMON: hide_title=true&hide_border=true&bg_color=00000000&card_width=460
  DARK: text_color=c9d1d9&icon_color=8b949e&title_color=c9d1d9
  LIGHT: text_color=1f2328&icon_color=59636e&title_color=1f2328
  STATS: show_icons=true&include_all_commits=true&hide_rank=true&text_bold=false&line_height=24
  LANGS: layout=compact&langs_count=8&hide=html,css,scss,tex&size_weight=0.5&count_weight=0.5

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Start from the cards that are already published, so a card whose
      # data fetch fails (e.g. a rate limit) keeps yesterday's version.
      - name: Fetch published cards
        run: |
          git clone --quiet --depth 1 --branch output \
            "https://github.com/${GITHUB_REPOSITORY}.git" dist || mkdir -p dist
          rm -rf dist/.git

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.COMMON }}&${{ env.DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.COMMON }}&${{ env.LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.COMMON }}&${{ env.DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.COMMON }}&${{ env.LIGHT }}
          path: dist/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: List cards
        run: ls -la dist

      # Only the default branch publishes; runs on other branches just check
      # that every card still builds.
      - name: Publish to the output branch
        if: github.ref_name == 'main'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch output
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Update profile cards"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
