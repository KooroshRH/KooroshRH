# Rebuilds the two activity cards in README.md (stats and weekly streak) and
# publishes them to the `output` branch, so `main` stays free of daily bot commits.
#
# Works with the default GITHUB_TOKEN (public activity only). To include
# private contributions, add a classic personal access token with the
# `read:user` and `repo` scopes as a repository secret named STATS_TOKEN.

name: Profile cards

on:
  schedule:
    - cron: "41 7 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Borderless cards on a transparent background, so they sit in the page.
  # Both are 460x171 so they line up side by side.
  STATS: show_icons=true&include_all_commits=true&hide_rank=true&hide_title=true&text_bold=false&line_height=26&hide_border=true&bg_color=00000000&card_width=460
  STATS_DARK: text_color=c9d1d9&icon_color=8b949e&title_color=c9d1d9
  STATS_LIGHT: text_color=1f2328&icon_color=59636e&title_color=1f2328
  STREAK: mode=weekly&hide_border=true&background=00000000&card_width=460&card_height=171
  STREAK_DARK: stroke=30363D&ring=2EA043&fire=3FB950&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=C9D1D9&sideLabels=C9D1D9&dates=8B949E&excludeDaysLabel=8B949E
  STREAK_LIGHT: stroke=D0D7DE&ring=1A7F37&fire=2DA44E&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=1F2328&sideLabels=1F2328&dates=59636E&excludeDaysLabel=59636E

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Start from the cards that are already published, so a card whose
      # data fetch fails (e.g. a rate limit) keeps yesterday's version.
      - name: Fetch published cards
        run: |
          git clone --quiet --depth 1 --branch output \
            "https://github.com/${GITHUB_REPOSITORY}.git" dist || mkdir -p dist
          rm -rf dist/.git

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.STATS_DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.STATS_LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Weekly streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK }}&${{ env.STREAK_DARK }}
          path: dist/streak-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Weekly streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK }}&${{ env.STREAK_LIGHT }}
          path: dist/streak-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Cards that are no longer shown in README.md.
      - name: Drop retired cards
        run: rm -f dist/top-langs-*.svg dist/snake-*.svg

      - name: List cards
        run: ls -la dist

      # Only the default branch publishes; runs on other branches just check
      # that every card still builds.
      - name: Publish to the output branch
        if: github.ref_name == 'main'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch output
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Update profile cards"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
