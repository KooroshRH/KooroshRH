# Rebuilds the GitHub activity cards shown in README.md and publishes them to
# the `output` branch, so `main` stays free of daily bot commits.
#
# Works with the default GITHUB_TOKEN (public activity only). To include
# private contributions, add a classic personal access token with the
# `read:user` and `repo` scopes as a repository secret named STATS_TOKEN.

name: Profile cards

on:
  schedule:
    - cron: "41 7 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Shared look: GitHub's dark/light surfaces with the violet/cyan accent of the header.
  STATS_DARK: bg_color=0d1117&border_color=30363d&title_color=a78bfa&text_color=c9d1d9&icon_color=67e8f9&ring_color=a78bfa
  STATS_LIGHT: bg_color=ffffff&border_color=d0d7de&title_color=6d28d9&text_color=1f2328&icon_color=0e7490&ring_color=6d28d9
  STATS_OPTS: show_icons=true&include_all_commits=true&rank_icon=github&line_height=24&border_radius=8&card_width=495
  LANGS_OPTS: layout=compact&langs_count=8&hide=html,css,scss,tex&size_weight=0.5&count_weight=0.5&border_radius=8&card_width=495
  STREAK_DARK: background=0D1117&border=30363D&stroke=30363D&ring=A78BFA&fire=67E8F9&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=A78BFA&sideLabels=C9D1D9&dates=8B949E&excludeDaysLabel=8B949E
  STREAK_LIGHT: background=FFFFFF&border=D0D7DE&stroke=D0D7DE&ring=6D28D9&fire=0E7490&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=6D28D9&sideLabels=1F2328&dates=59636E&excludeDaysLabel=59636E
  STREAK_OPTS: mode=weekly&border_radius=8&card_width=1000

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Start from the cards that are already published, so a card whose
      # data fetch fails (e.g. a rate limit) keeps yesterday's version.
      - name: Fetch published cards
        run: |
          git clone --quiet --depth 1 --branch output \
            "https://github.com/${GITHUB_REPOSITORY}.git" dist || mkdir -p dist
          rm -rf dist/.git

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTS }}&${{ env.STATS_DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS_OPTS }}&${{ env.STATS_LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTS }}&${{ env.STATS_DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS_OPTS }}&${{ env.STATS_LIGHT }}
          path: dist/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Weekly streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK_OPTS }}&${{ env.STREAK_DARK }}
          path: dist/streak-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Weekly streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&${{ env.STREAK_OPTS }}&${{ env.STREAK_LIGHT }}
          path: dist/streak-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?color_snake=#67e8f9&color_dots=#161b22,#2e1f5e,#4c2f9e,#7c5cf0,#b8a4ff
            dist/snake-light.svg?color_snake=#0e7490&color_dots=#ebedf0,#ddd3fe,#b7a2fb,#7c5cf0,#4c1d95

      - name: List cards
        run: ls -la dist

      # Only the default branch publishes; runs on other branches just check
      # that every card still builds.
      - name: Publish to the output branch
        if: github.ref_name == 'main'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch output
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Update profile cards"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
